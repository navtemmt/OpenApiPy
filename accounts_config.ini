# Multi-Account Trading Configuration
# Safe to commit - credentials are loaded from .env file
# Only trading behavior settings are stored here

# Each enabled account should have a unique route_magic_number.
# Incoming MT5 trade events are routed to exactly one cTrader account by magic.
# Example:
#   MT5 magic 1001 -> Account_Demo
#   MT5 magic 2002 -> Account_Broker2

# ============================================================================
# ACCOUNT 1: Demo Account
# ============================================================================
[Account_Demo]
enabled = true
environment = demo

route_magic_number =
magic_numbers = 777777,878787,878788,878789,878790

symbol_prefix =
symbol_suffix = +
custom_symbols = {"US30": "US 30", "USTEC": "US TECH 100", "US500": "US 500"}

lot_multiplier = 1.0
min_lot_size = 0.01
max_lot_size = 100.0
copy_sl = true
copy_tp = true

risk_mode = FIXED_USD
reject_if_no_sl = false
fixed_lot = 0.01
fixed_usd_risk = 50
risk_percent = 0.50
risk_reference = EQUITY
source_volume_fallback = true

startup_sync_market_orders = true
startup_market_recovery_mode = market_or_pending
startup_market_max_distance_pips = 10.0
startup_pending_expiration_ms = 0

max_daily_trades = 500
max_concurrent_positions = 100

allowed_symbols =
blocked_symbols =


# ============================================================================
# ACCOUNT 2: Another Broker (Example - Disabled)
# ============================================================================
[Account_1067384]
enabled = true
environment = live

# Unique MT5 magic number used to route events to this account
route_magic_number = 777777

# Different symbol suffix for this broker
symbol_prefix =
symbol_suffix = +
custom_symbols = {"US30": "US 30", "USTEC": "US TECH 100", "US500": "US 500"}

# Trading settings for this account
lot_multiplier = 1.0
min_lot_size = 0.01
max_lot_size = 100.0
copy_sl = true
copy_tp = true

# Risk sizing mode
risk_mode = FIXED_USD        ; SOURCE_VOLUME | FIXED_LOT | PERCENT_EQUITY | FIXED_USD
reject_if_no_sl = false      ; applies to FIXED_USD / PERCENT_EQUITY; FIXED_LOT always takes
fixed_lot = 0.01             ; used only when risk_mode=FIXED_LOT

# FIXED_USD parameters
fixed_usd_risk = 50.0        ; max loss at SL per trade, in deposit currency (or USD if account is USD)

# PERCENT_EQUITY parameters (only if you use it)
risk_percent = 1
risk_reference = EQUITY      ; EQUITY | BALANCE

# Optional: if no SL and reject_if_no_sl=false, fallback
source_volume_fallback = true

# Startup sync for missed live market positions
startup_sync_market_orders = false
startup_market_recovery_mode = market_or_pending   ; market | market_or_pending | skip
startup_market_max_distance_pips = 10.0
startup_pending_expiration_ms = 0                  ; 0 = no expiry

# Risk management per account
max_daily_trades = 500
max_concurrent_positions = 100

# Filtering
# magic_numbers is optional/legacy filtering. Leave empty when route_magic_number is used for routing.
magic_numbers =
allowed_symbols =
blocked_symbols =

